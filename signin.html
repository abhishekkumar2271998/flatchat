<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · flatchat</title>
    <style>
      :root {
        --text: #6b6375;
        --text-h: #08060d;
        --bg: #f7f6f9;
        --surface: #fff;
        --border: #e5e4e7;
        --accent: #aa3bff;
        --accent-hover: #9526ef;
        --accent-ring: rgba(170, 59, 255, 0.25);
        --error: #d92d20;
        --success: #067647;
        --shadow: rgba(0, 0, 0, 0.1) 0 10px 15px -3px,
          rgba(0, 0, 0, 0.05) 0 4px 6px -2px;
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text: #9ca3af;
          --text-h: #f3f4f6;
          --bg: #16171d;
          --surface: #1f2028;
          --border: #2e303a;
          --accent: #c084fc;
          --accent-hover: #d0a2fd;
          --accent-ring: rgba(192, 132, 252, 0.3);
          --error: #f97066;
          --success: #47cd89;
          --shadow: rgba(0, 0, 0, 0.4) 0 10px 15px -3px,
            rgba(0, 0, 0, 0.25) 0 4px 6px -2px;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font: 16px/1.45 system-ui, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 400px;
        padding: 40px 32px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .brand {
        width: 44px;
        height: 44px;
        margin-bottom: 20px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        font-weight: 600;
        color: var(--text-h);
      }

      .subtitle {
        margin: 0 0 28px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 18px;
      }

      .label-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      label {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-h);
      }

      input[type='email'],
      input[type='password'],
      input[type='text'] {
        width: 100%;
        padding: 10px 12px;
        font: inherit;
        color: var(--text-h);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      input:focus-visible {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-ring);
      }

      input[aria-invalid='true'] {
        border-color: var(--error);
      }

      .password-wrap {
        position: relative;
      }

      .password-wrap input {
        padding-right: 64px;
      }

      .toggle {
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        padding: 4px 8px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: none;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .toggle:hover {
        color: var(--text-h);
      }

      .error {
        font-size: 13px;
        color: var(--error);
      }

      .error:empty {
        display: none;
      }

      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
        font-weight: 400;
        color: var(--text);
        cursor: pointer;
      }

      .checkbox input {
        accent-color: var(--accent);
      }

      .submit {
        width: 100%;
        padding: 11px 16px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }

      .submit:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .submit:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--accent-ring);
      }

      .submit:disabled {
        opacity: 0.7;
        cursor: progress;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        font-size: 14px;
      }

      a:hover {
        text-decoration: underline;
      }

      .status {
        margin: 0 0 18px;
        font-size: 14px;
      }

      .status:empty {
        display: none;
      }

      .status.is-error {
        color: var(--error);
      }

      .status.is-success {
        color: var(--success);
      }

      .footer {
        margin: 24px 0 0;
        text-align: center;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand" aria-hidden="true">fc</div>
      <h1>Sign in to flatchat</h1>
      <p class="subtitle">Welcome back. Enter your details below.</p>

      <form id="signin-form" novalidate>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            aria-describedby="email-error"
            autofocus
          />
          <span id="email-error" class="error"></span>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#">Forgot password?</a>
          </div>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              aria-describedby="password-error"
            />
            <button
              type="button"
              id="toggle-password"
              class="toggle"
              aria-label="Show password"
              aria-pressed="false"
            >
              Show
            </button>
          </div>
          <span id="password-error" class="error"></span>
        </div>

        <label class="checkbox">
          <input id="remember" name="remember" type="checkbox" />
          Remember me
        </label>

        <button type="submit" class="submit">Sign in</button>
      </form>

      <p class="footer">Don't have an account? <a href="signup.html">Sign up</a></p>
    </main>

    <script>
      const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/

      const form = document.getElementById('signin-form')
      const email = document.getElementById('email')
      const password = document.getElementById('password')
      const remember = document.getElementById('remember')
      const toggle = document.getElementById('toggle-password')
      const status = document.getElementById('form-status')
      const submit = form.querySelector('.submit')

      // Placeholder until a real auth backend exists. Replace the body with a
      // call to your API; throw an Error to show its message in the form.
      async function signIn({ email, password, remember }) {
        await new Promise((resolve) => setTimeout(resolve, 600))
        console.info('signIn stub called for', email)
      }

      function setFieldError(input, message) {
        document.getElementById(input.id + '-error').textContent = message
        input.setAttribute('aria-invalid', message ? 'true' : 'false')
      }

      function setStatus(message, kind) {
        status.textContent = message
        status.className = 'status' + (kind ? ' is-' + kind : '')
      }

      function validate() {
        const emailValue = email.value.trim()
        let emailError = ''
        if (!emailValue) emailError = 'Enter your email address.'
        else if (!EMAIL_PATTERN.test(emailValue))
          emailError = 'Enter a valid email address.'
        const passwordError = password.value ? '' : 'Enter your password.'

        setFieldError(email, emailError)
        setFieldError(password, passwordError)

        if (emailError) email.focus()
        else if (passwordError) password.focus()
        return !emailError && !passwordError
      }

      toggle.addEventListener('click', () => {
        const show = password.type === 'password'
        password.type = show ? 'text' : 'password'
        toggle.textContent = show ? 'Hide' : 'Show'
        toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password')
        toggle.setAttribute('aria-pressed', String(show))
      })

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        setStatus('')
        if (!validate()) return

        submit.disabled = true
        submit.textContent = 'Signing in…'
        try {
          await signIn({
            email: email.value.trim(),
            password: password.value,
            remember: remember.checked,
          })
          setStatus('Signed in as ' + email.value.trim() + '.', 'success')
        } catch (err) {
          setStatus(err instanceof Error ? err.message : 'Sign in failed.', 'error')
        } finally {
          submit.disabled = false
          submit.textContent = 'Sign in'
        }
      })
    </script>
  </body>
</html>
